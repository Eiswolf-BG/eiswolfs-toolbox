[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Zeitstempel vor jeder Zeile im seriellen Monitor - gleiches Muster wie
; im Schwesterprojekt Eiswolfs Flightradar CYD.
monitor_filters = time
upload_speed = 921600

; Eigene Partitionstabelle: EIN einziges, grosses App-Image statt des
; ESP32-Standard-Doppel-OTA-Schemas (Alex' Auftrag, 06.10. - endgueltige
; Entscheidung, siehe CLAUDE.md "Partitionsschema" - die urspruenglich
; erwogene Idee, auf demselben Geraet zwischen dieser Firmware und
; Eiswolfs Flightradar CYD umzuschalten, ist verworfen). Betrifft NUR
; dieses Projekt - Flightradar bleibt bei seinem eigenen Doppel-OTA-
; Schema (eigenes Repo, eigene platformio.ini, nicht angefasst).
board_build.partitions = partitions.csv

; Gleiche Hardware wie Eiswolfs Flightradar CYD: ESP32-2432S028 ("Cheap
; Yellow Display"), ILI9341-Display (240x320), XPT2046 resistiver
; Touch-Controller, kein PSRAM. Pin-Belegung/SPI-Frequenzen 1:1 aus dem
; Flightradar-Projekt uebernommen (dort ueber lange Testreihen ermittelt
; und bewaehrt) - siehe dortige platformio.ini als Referenz, falls sich
; die Werte hier mal auseinanderentwickeln sollten.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=1000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
